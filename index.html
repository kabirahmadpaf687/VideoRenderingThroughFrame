<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>By Layla Saleh</title>
   <link rel="icon" type="image/x-icon" href="favicon.jpg">

  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
</head>
<body>

  <canvas id="hero"></canvas>
  <div class="white-overlay"></div>

  <div class="overlay">
    <img src="logo.png" alt="logo" class="logo">
    <h1>SOON</h1>
  </div>
  <div class="scroll-hint" id="scrollHint">
    <div class="arrow">↓</div>
  </div>

  <div class="spacer"></div>

  <section class="form-container" id="footer-forms">
    <div class="form-wrapper">
      <div class="newsletter-section">
        <h2 class="serif-title">STAY UPDATED</h2>
        <p>Join our newsletter for the latest updates.</p>
        <form id="newsletter-form" class="newsletter-form">
          <input type="email" name="email" placeholder="EMAIL ADDRESS" required>
          <button type="submit">SUBSCRIBE</button>
        </form>
      </div>

      <div class="divider"></div>

      <div class="contact-section">
        <h2 class="serif-title">GET IN TOUCH</h2>
        <form id="contact-form" class="contact-form">
          <div class="input-group">
            <input type="text" name="name" placeholder="YOUR NAME" required>
            <input type="email" name="email" placeholder="YOUR EMAIL" required>
          </div>
          <textarea name="message" placeholder="YOUR MESSAGE" rows="4" required></textarea>
          <button type="submit">SEND MESSAGE</button>
        </form>
      </div>
    </div>
    
    <div class="footer-bottom">
      <p>&copy; By Layla Saleh. ALL RIGHTS RESERVED.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
